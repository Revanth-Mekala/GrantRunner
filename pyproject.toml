[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grantrunner"
version = "0.1.0"
description = "A desktop grant application worker with a remote approval dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "playwright>=1.51,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
grantrunner = "grantrunner.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
